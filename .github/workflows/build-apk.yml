name: Build Android APK

# Jalan otomatis tiap kali push ke branch main, ATAU dipicu manual
# lewat tab "Actions" di GitHub (tombol "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        # Sengaja TIDAK pakai action android-actions/setup-android@v3 di
        # sini â€” action itu (dan turunan berbasis "tools" lain) mencoba
        # menginstal paket SDK lama bernama "tools" yang sudah dihapus
        # total dari server Google, jadi step-nya SELALU gagal (error
        # "Failed to find package 'tools'"). Runner ubuntu-latest bawaan
        # GitHub Actions sudah punya Android SDK + cmdline-tools
        # terpasang otomatis (variabel ANDROID_HOME sudah diset), jadi
        # kita cukup pastikan platform & build-tools yang dibutuhkan
        # Capacitor/Gradle sudah ada lewat sdkmanager bawaan itu.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependency npm
        run: npm install

      - name: Tambahkan & sinkronkan platform Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate icon aplikasi dari resources/icon.png
        # Membaca resources/icon.png (+ icon-foreground.png/icon-background.png
        # untuk adaptive icon) lalu menimpa semua ukuran ic_launcher di
        # android/app/src/main/res/mipmap-* secara otomatis. Cukup ganti
        # file di folder resources/ untuk mengganti icon aplikasi â€” tidak
        # perlu utak-atik folder android/ secara manual.
        run: npx @capacitor/assets generate --android

      - name: Build APK (debug - siap sideload/install manual)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: PengirimanPaket-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
